<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>Payment</title>
    <script src="/assets/bootstrap/js/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f3edff;
            color: #3d2a6d;
            min-height: 100vh;
        }

        .page {
            max-width: 430px;
            margin: 0 auto;
            min-height: 100vh;
            padding-bottom: 32px;
        }

        .header {
            background: #7c3aed;
            color: #fff;
            text-align: center;
            padding: 28px 20px 32px;
        }

        .header-label {
            font-size: 15px;
            font-weight: 500;
            opacity: 0.95;
            margin-bottom: 8px;
        }

        .header-amount {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 0.5px;
            line-height: 1.2;
            margin-bottom: 10px;
        }

        .header-timer {
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .main {
            padding: 16px 14px 0;
        }

        .card {
            background: #ebe3ff;
            border: 1px solid #c4b0f0;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 14px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: #4c1d95;
            margin-bottom: 12px;
        }

        .method-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .method-item {
            display: none;
            align-items: center;
            gap: 12px;
            background: #fff;
            border: 1px solid #d4c4f5;
            border-radius: 10px;
            padding: 12px 14px;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }

        .method-item:active,
        .method-item.active {
            border-color: #7c3aed;
            background: #f8f5ff;
        }

        .method-item img {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        .method-item span {
            font-size: 16px;
            font-weight: 600;
            color: #2d1b4e;
        }

        .info-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            border: 1px solid #d8d0e8;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 10px;
            gap: 10px;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        .info-text {
            flex: 1;
            min-width: 0;
            font-size: 14px;
            color: #2d1b4e;
            word-break: break-all;
            line-height: 1.4;
        }

        .info-text strong {
            font-weight: 700;
        }

        .copy-btn {
            flex-shrink: 0;
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            cursor: pointer;
            color: #6b46c1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .copy-btn:active {
            opacity: 0.6;
        }

        .qr-section {
            text-align: center;
            padding: 10px 0 0;
        }

        .qr-wrap {
            display: inline-block;
            background: #fff;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        #qrcode {
            width: 220px;
            height: 220px;
        }

        #qrcode img,
        #qrcode canvas {
            width: 220px !important;
            height: 220px !important;
            display: block;
        }

        .save-btn {
            display: inline-block;
            min-width: 160px;
            padding: 10px 24px;
            background: #ebe3ff;
            border: 1px solid #9b7ed9;
            border-radius: 10px;
            color: #4c1d95;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .save-btn:active {
            opacity: 0.8;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 48px;
            transform: translateX(-50%) translateY(20px);
            background: rgba(45, 27, 78, 0.92);
            color: #fff;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 1000;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .error-box {
            display: none;
            text-align: center;
            padding: 60px 24px;
            color: #6b7280;
        }

        .error-box h4 {
            font-size: 22px;
            color: #374151;
            margin-bottom: 8px;
        }
    </style>
</head>

<body>
    <div class="page" id="payment_page">
        <div class="header">
            <div class="header-label">Payment Amount</div>
            <div class="header-amount" id="pay-amount">₹0.00</div>
            <div class="header-timer" id="countdown_timer">00:05:00</div>
        </div>

        <div class="main">
            <div class="card">
                <div class="card-title">Select Payment Method</div>
                <div class="method-list">
                    <div class="method-item" id="paytm" onclick="checkPayment('paytm')">
                        <img src="/assets/bootstrap/res/paytm.svg" alt="Paytm">
                        <span>Paytm</span>
                    </div>
                    <div class="method-item" id="phonepe" onclick="checkPayment('phonepe')">
                        <img src="/assets/bootstrap/res/phonepe.svg" alt="PhonePe">
                        <span>PhonePe</span>
                    </div>
                    <div class="method-item" id="gpay" onclick="checkPayment('gpay')">
                        <img src="/assets/bootstrap/res/googlepay.svg" alt="Google Pay">
                        <span>Google Pay</span>
                    </div>
                    <div class="method-item" id="bhim" onclick="checkPayment('bhim')">
                        <img src="/assets/bootstrap/res/bhim.svg" alt="BHIM">
                        <span>BHIM</span>
                    </div>
                    <div class="method-item" id="upi" onclick="checkPayment('upi')">
                        <img src="/assets/bootstrap/res/upi.svg" alt="UPI">
                        <span>UPI Pay</span>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="info-row">
                    <div class="info-text">UPI: <strong id="upi-id">--</strong></div>
                    <button type="button" class="copy-btn" onclick="copyText('upi-id')" aria-label="Copy UPI">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                    </button>
                </div>
                <div class="info-row">
                    <div class="info-text">Jumlah: <strong id="copy-amount">--</strong></div>
                    <button type="button" class="copy-btn" onclick="copyText('copy-amount')" aria-label="Copy amount">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="qr-section">
                <div class="qr-wrap">
                    <div id="qrcode"></div>
                </div>
                <button type="button" class="save-btn" onclick="saveQRCode()">Save QR code</button>
            </div>
        </div>
    </div>

    <div class="error-box" id="error_500">
        <h4>500</h4>
        <p>Something went wrong</p>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        var timer = null;
        var countdownTimer = null;
        var pay_list = {};
        var qrCodeInstance = null;
        var orderAmount = '';
        var returnUrl = '';

        function getQueryString(name) {
            var reg = new RegExp('(^|&)' + name + '=([^&]*)(&|$)', 'i');
            var r = window.location.search.substr(1).match(reg);
            if (r != null) {
                return decodeURIComponent(r[2]);
            }
            return null;
        }

        function showToast(msg) {
            var $toast = $('#toast');
            $toast.text(msg).addClass('show');
            setTimeout(function () {
                $toast.removeClass('show');
            }, 1800);
        }

        function showError() {
            $('#payment_page').hide();
            $('#error_500').show();
            if (timer) {
                clearInterval(timer);
            }
            if (countdownTimer) {
                clearInterval(countdownTimer);
            }
        }

        function getUpiInfo() {
            $.ajax({
                type: 'get',
                url: '/api/payment/upi/' + getQueryString('order_no'),
                success: function (response) {
                    if (response.code === '0000') {
                        pay_list = response.data || {};
                        var methods = ['paytm', 'phonepe', 'gpay', 'bhim'];
                        var firstShown = null;
                        methods.forEach(function (key) {
                            if (pay_list[key] && pay_list[key] !== '') {
                                $('#' + key).css('display', 'flex');
                                if (!firstShown) {
                                    firstShown = key;
                                }
                            }
                        });
                        if (firstShown) {
                            $('#' + firstShown).addClass('active');
                        }
                        if (pay_list.pa) {
                            $('#upi-id').text(pay_list.pa);
                        }
                        var qrContent = pay_list.upi || pay_list.default || '';
                        if (qrContent) {
                            generateQRCode(qrContent);
                        }
                    } else {
                        showError();
                    }
                },
                error: function () {
                    showError();
                }
            });
        }

        function getOrderStatus() {
            $.ajax({
                type: 'get',
                url: '/api/payment/status/' + getQueryString('order_no'),
                success: function (response) {
                    if (response.amount) {
                        orderAmount = response.amount;
                        $('#pay-amount').text('₹' + response.amount);
                        $('#copy-amount').text(response.amount);
                    }
                    if (response.return_url) {
                        returnUrl = response.return_url;
                    }
                    if (response.status) {
                        if (response.status === 'success') {
                            clearInterval(timer);
                            clearInterval(countdownTimer);
                            alert('Payment successful!');
                            if (response.return_url && response.return_url !== '') {
                                window.location.href = response.return_url;
                            }
                        } else if (response.status === 'failed') {
                            clearInterval(timer);
                            clearInterval(countdownTimer);
                            alert('Payment failed. Please try again.');
                        }
                    } else {
                        showError();
                    }
                },
                error: function () {
                    showError();
                }
            });
        }

        function checkPayment(paymentMethod) {
            var url = pay_list[paymentMethod] || '';
            if (url === '') {
                alert('Payment method not available.');
                return;
            }
            $('.method-item').removeClass('active');
            $('#' + paymentMethod).addClass('active');
            clickStats(paymentMethod);
            setTimeout(function () {
                window.location.href = url;
            }, 300);
        }

        function startCountdown(duration) {
            if (countdownTimer) {
                clearInterval(countdownTimer);
            }
            var remain = duration;
            updateTimerDisplay(remain);
            countdownTimer = setInterval(function () {
                remain--;
                if (remain < 0) {
                    clearInterval(countdownTimer);
                    return;
                }
                updateTimerDisplay(remain);
            }, 1000);
        }

        function updateTimerDisplay(seconds) {
            var h = Math.floor(seconds / 3600);
            var m = Math.floor((seconds % 3600) / 60);
            var s = seconds % 60;
            var pad = function (n) {
                return n < 10 ? '0' + n : '' + n;
            };
            $('#countdown_timer').text(pad(h) + ':' + pad(m) + ':' + pad(s));
        }

        function clickStats(paymentMethod) {
            $.ajax({
                type: 'get',
                url: '/api/payment/stats',
                data: {
                    id: getQueryString('order_no'),
                    pay_type: paymentMethod
                }
            });
        }

        function generateQRCode(content) {
            $('#qrcode').empty();
            try {
                qrCodeInstance = new QRCode(document.getElementById('qrcode'), {
                    text: content,
                    width: 220,
                    height: 220,
                    colorDark: '#000000',
                    colorLight: '#ffffff',
                    correctLevel: QRCode.CorrectLevel.M
                });
            } catch (e) {
                console.error('QR code generation failed:', e);
            }
        }

        function copyText(elementId) {
            var text = $('#' + elementId).text().trim();
            if (!text || text === '--') {
                showToast('Nothing to copy');
                return;
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function () {
                    showToast('Copied');
                }).catch(function () {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            var $temp = $('<textarea>');
            $('body').append($temp);
            $temp.val(text).select();
            try {
                document.execCommand('copy');
                showToast('Copied');
            } catch (e) {
                showToast('Copy failed');
            }
            $temp.remove();
        }

        function saveQRCode() {
            var canvas = document.querySelector('#qrcode canvas');
            var img = document.querySelector('#qrcode img');
            var dataUrl = '';
            if (canvas) {
                dataUrl = canvas.toDataURL('image/png');
            } else if (img && img.src) {
                dataUrl = img.src;
            }
            if (!dataUrl) {
                showToast('QR code not ready');
                return;
            }
            var link = document.createElement('a');
            link.href = dataUrl;
            link.download = 'payment-qrcode.png';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('QR code saved');
        }

        $(document).ready(function () {
            if (timer) {
                clearInterval(timer);
            }
            timer = setInterval(function () {
                getOrderStatus();
            }, 5000);
            getUpiInfo();
            getOrderStatus();
            startCountdown(300);
        });
    </script>
</body>

</html>
